<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой Чат</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2f7;
}

.chat {
  max-width: 600px;
  height: 100vh;
  margin: auto;
  background: white;
  display: flex;
  flex-direction: column;
}

.header {
  background: #2196f3;
  color: white;
  padding: 18px;
  font-size: 24px;
  font-weight: bold;
  text-align: center;
}

.messages {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

.message {
  background: #e3f2fd;
  padding: 12px;
  border-radius: 15px;
  margin-bottom: 10px;
  max-width: 80%;
}

.input-area {
  display: flex;
  padding: 10px;
  border-top: 1px solid #ddd;
  gap: 8px;
}

input {
  flex: 1;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 25px;
  font-size: 16px;
}

button {
  border: none;
  background: #2196f3;
  color: white;
  padding: 14px 20px;
  border-radius: 25px;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="chat">

  <div class="header">
    💬 Мой Чат
  </div>

  <div class="messages" id="messages">
    <div class="message">
      👋 Добро пожаловать в чат!
    </div>
  </div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Напишите сообщение..."
    >
    <button onclick="sendMessage()">Отправить</button>
  </div>

</div>

<script>
function sendMessage() {
  const input = document.getElementById("messageInput");
  const messages = document.getElementById("messages");

  if (input.value.trim() === "") return;

  const message = document.createElement("div");
  message.className = "message";
  message.textContent = input.value;

  messages.appendChild(message);

  input.value = "";
  messages.scrollTop = messages.scrollHeight;
}

document.getElementById("messageInput").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
