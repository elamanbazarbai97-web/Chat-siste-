
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой Чат</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef1f5;
  color: #222;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  border: none;
}

.app {
  max-width: 650px;
  height: 100dvh;
  min-height: 450px;
  margin: auto;
  background: white;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.header {
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: white;
  border-bottom: 1px solid #ddd;
}

.avatar {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #e1e1e1;
  object-fit: cover;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
  flex-shrink: 0;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.header-info {
  flex: 1;
  min-width: 0;
}

.header-info strong {
  font-size: 21px;
  overflow-wrap: anywhere;
}

.header-info small {
  display: block;
  color: #777;
  margin-top: 5px;
}

.icon-button {
  width: 44px;
  height: 44px;
  background: transparent;
  font-size: 25px;
  border-radius: 50%;
}

.icon-button:active {
  background: #eee;
}

.view {
  display: none;
  flex: 1;
  min-height: 0;
  flex-direction: column;
}

.view.active {
  display: flex;
}

.section-title {
  padding: 18px;
  font-size: 23px;
  font-weight: bold;
  background: white;
  border-bottom: 1px solid #eee;
}

.contact-list {
  overflow-y: auto;
  flex: 1;
}

.contact {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  background: white;
  border-bottom: 1px solid #eee;
  text-align: left;
}

.contact:hover {
  background: #f6f7f8;
}

.contact-info {
  flex: 1;
  min-width: 0;
}

.contact-info strong {
  display: block;
  font-size: 17px;
}

.contact-info small {
  display: block;
  margin-top: 5px;
  color: #777;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.empty {
  padding: 30px 20px;
  text-align: center;
  color: #888;
  line-height: 1.5;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  background: #f2f3f5;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.message {
  max-width: 82%;
  padding: 11px 14px;
  border-radius: 17px;
  background: white;
  overflow-wrap: anywhere;
  align-self: flex-start;
  box-shadow: 0 1px 2px #0000000a;
}

.message.mine {
  background: #d9fdd3;
  align-self: flex-end;
}

.message-time {
  display: block;
  text-align: right;
  font-size: 10px;
  color: #777;
  margin-top: 5px;
}

.composer {
  padding: 10px;
  display: flex;
  gap: 8px;
  align-items: center;
  background: white;
  border-top: 1px solid #eee;
}

.composer input {
  flex: 1;
  min-width: 0;
  padding: 14px 16px;
  border: 1px solid #ddd;
  border-radius: 28px;
  outline: none;
}

.composer input:focus {
  border-color: #777;
}

.send-button {
  width: 54px;
  height: 54px;
  flex-shrink: 0;
  background: #505050;
  color: white;
  border-radius: 50%;
  font-size: 23px;
}

.bottom-nav {
  display: flex;
  justify-content: space-around;
  background: white;
  border-top: 1px solid #ddd;
  padding: 6px 0;
  padding-bottom: max(6px, env(safe-area-inset-bottom));
}

.nav-button {
  flex: 1;
  height: 55px;
  background: white;
  font-size: 28px;
  color: #444;
}

.nav-button.active {
  background: #ededed;
  border-radius: 12px;
}

.profile-content {
  padding: 24px 18px;
  overflow-y: auto;
}

.profile-photo {
  width: 110px;
  height: 110px;
  margin: 0 auto 18px;
  font-size: 55px;
}

.field {
  margin: 18px 0;
}

.field label {
  display: block;
  color: #666;
  margin-bottom: 8px;
}

.field input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
}

.primary-button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  background: #444;
  color: white;
  margin-top: 10px;
}

.secondary-button {
  padding: 10px 14px;
  border-radius: 10px;
  background: #eee;
  color: #222;
}

#photoInput {
  display: none;
}

.modal {
  position: absolute;
  inset: 0;
  background: #0007;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.modal.show {
  display: flex;
}

.modal-card {
  width: 100%;
  max-width: 380px;
  padding: 22px;
  background: white;
  border-radius: 18px;
}

.modal-card h3 {
  margin-top: 0;
}

.modal-card input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin: 8px 0;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.modal-actions button {
  flex: 1;
}

@media (min-width: 700px) {
  body {
    padding: 15px;
  }

  .app {
    height: calc(100dvh - 30px);
    border-radius: 15px;
    box-shadow: 0 3px 20px #00000010;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="avatar" id="headerAvatar">👤</div>

    <div class="header-info">
      <strong id="headerName">Мой Чат</strong>
      <small id="headerStatus">Личные сообщения</small>
    </div>

    <button class="icon-button" id="headerMenu"
      aria-label="Меню">⋮</button>
  </div>

  <section class="view active" id="chatsView">
    <div class="section-title">Сообщения</div>
    <div class="contact-list" id="contactList"></div>
  </section>

  <section class="view" id="contactsView">
    <div class="section-title">Контакты</div>
    <div class="contact-list" id="allContacts"></div>
    <div style="padding:12px">
      <button class="primary-button" id="addContactButton">
        ➕ Добавить контакт
      </button>
    </div>
  </section>

  <section class="view" id="chatView">
    <div class="header">
      <button class="icon-button" id="backButton"
        aria-label="Назад">‹</button>

      <div class="avatar" id="chatAvatar">👤</div>

      <div class="header-info">
        <strong id="chatName">Контакт</strong>
        <small>Личная переписка</small>
      </div>

      <button class="icon-button" id="chatMenu"
        aria-label="Меню">⋮</button>
    </div>

    <div class="messages" id="messageList"></div>

    <form class="composer" id="messageForm">
      <input id="messageInput"
        type="text"
        placeholder="Напишите сообщение..."
        autocomplete="off"
        maxlength="2000">

      <button class="send-button"
        type="submit"
        aria-label="Отправить">➤</button>
    </form>
  </section>

  <section class="view" id="profileView">
    <div class="section-title">Профиль</div>

    <div class="profile-content">
      <div class="avatar profile-photo" id="profileAvatar">👤</div>

      <button class="secondary-button"
        id="choosePhotoButton"
        style="display:block;margin:auto">
        🖼️ Выбрать фотографию
      </button>

      <input type="file" id="photoInput" accept="image/*">

      <div class="field">
        <label for="profileName">Имя</label>
        <input id="profileName"
          type="text"
          maxlength="40"
          placeholder="Введите имя">
      </div>

      <button class="primary-button" id="saveProfileButton">
        Сохранить профиль
      </button>
    </div>
  </section>

  <section class="view" id="moreView">
    <div class="section-title">Дополнительно</div>
    <div class="profile-content">
      <button class="primary-button" id="moreAddContact">
        ➕ Добавить контакт
      </button>

      <button class="primary-button" id="moreProfile">
        👤 Мой профиль
      </button>

      <p class="empty">
        Добро пожаловать в наш чат! ❤️
      </p>
    </div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-button active"
      data-view="chatsView"
      aria-label="Сообщения">💬</button>

    <button class="nav-button"
      data-view="contactsView"
      aria-label="Контакты">👥</button>

    <button class="nav-button"
      id="bottomAddContact"
      aria-label="Добавить контакт">➕</button>

    <button class="nav-button"
      data-view="profileView"
      aria-label="Профиль">🖼️</button>
