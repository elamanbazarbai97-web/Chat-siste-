<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой Чат</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef1f5;color:#222}
button,input{font:inherit}
button{cursor:pointer;border:none}
.app{max-width:650px;height:100dvh;min-height:450px;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative}
.header{padding:14px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #ddd}
.avatar{width:58px;height:58px;border-radius:50%;background:#e1e1e1;object-fit:cover;display:flex;justify-content:center;align-items:center;font-size:30px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.header-info{flex:1;min-width:0}
.header-info strong{font-size:21px;overflow-wrap:anywhere}
.header-info small{display:block;color:#777;margin-top:5px}
.icon-button{width:44px;height:44px;background:transparent;font-size:25px;border-radius:50%}
.icon-button:active{background:#eee}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.active{display:flex}
.section-title{padding:18px;font-size:23px;font-weight:bold;background:#fff;border-bottom:1px solid #eee}
.contact-list{overflow-y:auto;flex:1}
.contact{width:100%;display:flex;align-items:center;gap:12px;padding:13px;background:#fff;border-bottom:1px solid #eee;text-align:left}
.contact:hover{background:#f6f7f8}
.contact-info{flex:1;min-width:0}
.contact-info strong{display:block;font-size:17px}
.contact-info small{display:block;margin-top:5px;color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:30px 20px;text-align:center;color:#888;line-height:1.5}
.messages{flex:1;overflow-y:auto;padding:15px;background:#f2f3f5;display:flex;flex-direction:column;gap:10px}
.message{max-width:82%;padding:11px 14px;border-radius:17px;background:#fff;overflow-wrap:anywhere;align-self:flex-start;box-shadow:0 1px 2px #0000000a}
.message.mine{background:#d9fdd3;align-self:flex-end}
.message-time{display:block;text-align:right;font-size:10px;color:#777;margin-top:5px}
.composer{padding:10px;display:flex;gap:8px;align-items:center;background:#fff;border-top:1px solid #eee}
.composer input{flex:1;min-width:0;padding:14px 16px;border:1px solid #ddd;border-radius:28px;outline:none}
.composer input:focus{border-color:#777}
.send-button{width:54px;height:54px;flex-shrink:0;background:#505050;color:#fff;border-radius:50%;font-size:23px}
.bottom-nav{display:flex;justify-content:space-around;background:#fff;border-top:1px solid #ddd;padding:6px 0;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.nav-button{flex:1;height:55px;background:#fff;font-size:28px;color:#444}
.nav-button.active{background:#ededed;border-radius:12px}
.profile-content{padding:24px 18px;overflow-y:auto}
.profile-photo{width:110px;height:110px;margin:0 auto 18px;font-size:55px}
.field{margin:18px 0}
.field label{display:block;color:#666;margin-bottom:8px}
.field input,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;background:#fff}
.primary-button{width:100%;padding:14px;border-radius:10px;background:#444;color:#fff;margin-top:10px}
.secondary-button{padding:10px 14px;border-radius:10px;background:#eee;color:#222}
#photoInput{display:none}
.row{display:flex;gap:8px;align-items:center;margin:14px 0}
.row i{font-style:normal;font-size:24px;width:34px;text-align:center;flex-shrink:0}
.row input,.row select{flex:1;min-width:0;padding:13px;border:1px solid #ddd;border-radius:10px;background:#fff}
#profilePhone{background:#f4f4f4;color:#555}
#profileView .section-title{display:none}
.ro{flex:1;min-width:0;padding:13px;border:1px solid #ddd;border-radius:10px;background:#fff;overflow-wrap:anywhere}
.ro.ph{color:#999}
#cpView{position:relative}
.cbtn{width:64px;height:64px;border-radius:50%;color:#fff;font-size:28px}
.app > .header{cursor:pointer}
.app > .header .avatar{width:64px;height:64px}
.nav-button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav-button small{font-size:11px;color:#555}
.cside{display:flex;flex-direction:column;align-items:center;gap:2px}
.dots{font-size:22px;padding:2px 10px;color:#555}
.mrow{display:flex;align-items:flex-end;gap:6px}
.mrow.mine{justify-content:flex-end}
.mrow .avatar{width:32px;height:32px;font-size:16px}
.mrow .message{align-self:auto;max-width:100%}
.mcol{display:flex;flex-direction:column;align-items:flex-end;max-width:72%}
.mt{font-size:11px;color:#888;white-space:nowrap}
.tick{color:#4a90e2;font-size:12px;margin-top:2px}
#chatView .header-info small{display:inline;margin:0 0 0 10px}
.composer{position:relative;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.composer input{padding-right:58px}
.send-button{position:absolute;right:18px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 4px);width:40px;height:40px;font-size:20px}
#cpView .profile-content{flex:1;min-height:0}
.cp-tabs{display:flex;justify-content:space-around;margin:16px 0;padding-bottom:10px;border-bottom:1px solid #ddd}
.cp-tabs button{background:#fff;font-size:26px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border-radius:10px}
.cp-tabs button small{font-size:11px;color:#555}
.cp-tabs button.on{background:#ededed}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.modal{position:absolute;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.modal-card{width:100%;max-width:380px;padding:22px;background:#fff;border-radius:18px}
.modal-card h3{margin-top:0}
.modal-card input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:8px 0}
.modal-actions{display:flex;gap:10px;margin-top:12px}
.modal-actions button{flex:1}
@media (min-width:700px){
body{padding:15px}
.app{height:calc(100dvh - 30px);border-radius:15px;box-shadow:0 3px 20px #00000010}
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="avatar" id="headerAvatar">👤</div>
    <div class="header-info">
      <strong id="headerName">Мой Чат</strong>
      <small id="headerStatus">Личные сообщения</small>
    </div>
    <button class="icon-button" id="headerMenu" aria-label="Меню">⋮</button>
  </div>

  <section class="view active" id="chatsView">
    <div class="section-title">Сообщения</div>
    <div class="contact-list" id="contactList"></div>
  </section>

  <section class="view" id="contactsView">
    <div class="section-title">Контакты</div>
    <div class="contact-list" id="allContacts"></div>
    <div style="padding:12px">
      <button class="primary-button" id="addContactButton">➕ Добавить контакт</button>
    </div>
  </section>

  <section class="view" id="chatView">
    <div class="header">
      <button class="icon-button" id="backButton" aria-label="Назад">←</button>
      <div class="avatar" id="chatAvatar">👤</div>
      <div class="header-info">
        <strong id="chatName">Контакт</strong>
        <small id="chatStatus"></small>
      </div>
      <button class="icon-button" id="callAudio" aria-label="Аудиозвонок">📞</button>
      <button class="icon-button" id="callVideo" aria-label="Видеозвонок">🎥</button>
      <button class="icon-button" id="chatMenu" aria-label="Меню">⋮</button>
    </div>
    <div class="messages" id="messageList"></div>
    <form class="composer" id="messageForm">
      <input id="messageInput" type="text" placeholder="Начать SMS" autocomplete="off" maxlength="2000">
      <button class="send-button" type="submit" aria-label="Отправить">↑</button>
    </form>
  </section>

  <section class="view" id="cpView">
    <button class="icon-button" id="cpBack" aria-label="Назад" style="position:absolute;top:8px;left:8px;z-index:2;background:#ffffffcc">←</button>
    <div class="profile-content" style="text-align:center">
      <div class="avatar profile-photo" id="cpAvatar">👤</div>
      <h2 id="cpName" style="margin:0"></h2>
      <div class="cp-tabs">
        <button data-t="bio">🪪<small>Профиль</small></button>
        <button data-t="status">➕<small>Статус</small></button>
        <button data-t="photo">📷<small>Фото</small></button>
        <button data-t="video">🎬<small>Видео</small></button>
        <button data-t="sms">✉️<small>SMS</small></button>
      </div>
      <div id="cpContent" style="text-align:left"></div>
    </div>
  </section>

  <section class="view" id="profileView">
    <div class="section-title">Профиль</div>
    <div class="profile-content">
      <div class="avatar profile-photo" id="profileAvatar">👤</div>
      <button class="secondary-button" id="choosePhotoButton" style="display:block;margin:auto">🖼️ Выбрать фотографию</button>
      <input type="file" id="photoInput" accept="image/*">
      <div class="field"><input id="profileName" maxlength="40" placeholder="Имя Фамилия"></div>
      <div class="field"><input id="profilePhone" readonly placeholder="Тел. номер"></div>
      <div class="row"><i>🎂</i><input id="pBY" type="tel" inputmode="numeric" maxlength="4" placeholder="Год"><input id="pBD" type="tel" inputmode="numeric" maxlength="2" placeholder="День"><select id="pBM"><option value="">Месяц</option><option value="1">Январь</option><option value="2">Февраль</option><option value="3">Март</option><option value="4">Апрель</option><option value="5">Май</option><option value="6">Июнь</option><option value="7">Июль</option><option value="8">Август</option><option value="9">Сентябрь</option><option value="10">Октябрь</option><option value="11">Ноябрь</option><option value="12">Декабрь</option></select></div>
      <div class="row"><i>🏙️</i><input id="pCity" maxlength="40" placeholder="Город"><input id="pVillage" maxlength="40" placeholder="Село"></div>
      <div class="row"><i>🎓</i><input id="pEdu" maxlength="60" placeholder="Образование"></div>
      <div class="row"><i>💼</i><input id="pWork" maxlength="60" placeholder="Работа"></div>
      <div class="row"><i>🎯</i><input id="pHobby" maxlength="60" placeholder="Хобби"></div>
      <div class="row"><i>👤</i><select id="pGender"><option value="">Пол</option><option>Мужской</option><option>Женский</option></select></div>
      <div class="row"><i>💍</i><input id="pFamily" maxlength="40" placeholder="Семейное положение"></div>
      <div class="row"><i>➕</i><input id="pStatus" maxlength="100" placeholder="Статус"></div>
      <button class="secondary-button" id="addAlbumPhoto" style="display:block;margin:6px auto">📷 Добавить фото в альбом</button>
      <input type="file" id="albumInput" accept="image/*" style="display:none">
      <button class="primary-button" id="saveProfileButton">Сохранить профиль</button>
    </div>
  </section>

  <section class="view" id="statusView">
    <div class="section-title">Временный статус</div>
    <div class="profile-content">
      <div class="row"><input id="stText" maxlength="100" placeholder="Мой статус на 24 часа"><button class="secondary-button" id="stPost">Опубликовать</button></div>
      <div id="stList"></div>
    </div>
  </section>

  <section class="view" id="albumView">
    <div class="section-title">Альбом</div>
    <div class="profile-content">
      <button class="primary-button" id="albumAdd">📷 Добавить фото</button>
      <div class="grid" id="albumGrid" style="margin-top:14px"></div>
    </div>
  </section>

  <section class="view" id="moreView">
    <div class="section-title">Онлайн игры</div>
    <div class="profile-content">
      <p class="empty">Онлайн-игры скоро появятся. Напиши, во что хочешь играть! 🎮</p>
    </div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-button active" data-view="chatsView" aria-label="Чат">✉️<small>Чат</small></button>
    <button class="nav-button" data-view="contactsView" aria-label="Контакты">👥<small>Контакты</small></button>
    <button class="nav-button" data-view="statusView" aria-label="Статус">➕<small>Статус</small></button>
    <button class="nav-button" data-view="albumView" aria-label="Альбом">📷<small>Альбом</small></button>
    <button class="nav-button" data-view="moreView" aria-label="Игры">🎮<small>Игры</small></button>
  </nav>

  <div class="modal" id="callModal" style="background:#000;padding:0;align-items:stretch">
    <div style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;color:#fff">
      <video id="remoteVideo" autoplay playsinline style="flex:1;width:100%;min-height:0;object-fit:cover;background:#111"></video>
      <video id="localVideo" autoplay playsinline muted style="position:absolute;right:12px;top:12px;width:100px;border-radius:10px;background:#333"></video>
      <div id="callInfo" style="position:absolute;top:0;left:0;right:0;padding:20px;text-align:center;font-size:20px"></div>
      <div style="display:flex;justify-content:center;gap:28px;padding:18px;padding-bottom:max(18px,env(safe-area-inset-bottom));background:#000">
        <button class="cbtn" id="callAccept" style="background:#2a9d4a">📞</button>
        <button class="cbtn" id="callEnd" style="background:#d33">✖</button>
      </div>
    </div>
  </div>

  <div class="modal" id="loginModal">
    <div class="modal-card" style="text-align:center">
      <h3>Вход по номеру</h3>
      <div style="display:flex;gap:8px;align-items:center"><b>+996</b><input id="loginPhone" type="tel" inputmode="numeric" maxlength="12" placeholder="000 000 000"></div>
      <button class="primary-button" id="loginButton">Отправить</button>
    </div>
  </div>

  <div class="modal" id="contactModal">
    <div class="modal-card">
      <h3>Новый контакт</h3>
      <input id="newContactName" type="tel" inputmode="numeric" placeholder="Номер телефона (9 цифр)" maxlength="15">
      <div class="modal-actions">
        <button class="secondary-button" id="cancelContact">Отмена</button>
        <button class="primary-button" id="saveContact" style="margin-top:0">Добавить</button>
      </div>
    </div>
  </div>

  <div class="modal" id="menuModal">
    <div class="modal-card">
      <h3>Меню</h3>
      <button class="primary-button" id="menuProfile">👤 Мой профиль</button>
      <button class="primary-button" id="menuDelete" style="background:#a33">Удалить контакт</button>
      <button class="secondary-button" id="closeMenu" style="width:100%;margin-top:12px">Закрыть</button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, set, get, remove, onChildAdded, onValue, onDisconnect, query, limitToLast, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ===== 1. ВСТАВЬТЕ СЮДА КОНФИГ ИЗ FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyCR1-javU3E3VnLJpEY5N61WggV03r24KM",
  authDomain: "my--chat-7db98.firebaseapp.com",
  databaseURL: "https://my--chat-7db98-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my--chat-7db98",
  storageBucket: "my--chat-7db98.firebasestorage.app",
  messagingSenderId: "740490057583",
  appId: "1:740490057583:web:fddeb33ad95bf35047ba9a"
};
// ================================================

(function () {
"use strict";

const $ = id => document.getElementById(id);
const STORAGE_KEY = "my_chat_app_v2";
const UID_KEY = "my_chat_uid";

let state = { profile: { name: "", photo: "", phone: "", birth: "", city: "", village: "", edu: "", work: "", hobby: "", gender: "", family: "", status: "" }, contacts: [], messages: {}, activeContact: null };
let currentView = "chatsView";
const listening = {};
const presence = {};

// ---------- Firebase ----------
let db = null;
if (!firebaseConfig.apiKey.startsWith("ВСТАВЬ")) {
  try { db = getDatabase(initializeApp(firebaseConfig)); }
  catch (e) { console.error(e); }
}

let myUid = "";
try { myUid = localStorage.getItem(UID_KEY) || ""; } catch (e) {}
if (!myUid) {
  myUid = "u_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  try { localStorage.setItem(UID_KEY, myUid); } catch (e) {}
}

const normPhone = v => { const d = String(v).replace(/\D/g, ""); if (d.length === 9) return "996" + d; return /^996\d{9}$/.test(d) ? d : ""; };
const showName = (n, k) => n || "+" + k;
const myKey = () => state.profile.phone;
const chatIdWith = otherKey => [myKey(), otherKey].sort().join("__");
const fmtTime = ts => new Date(ts || Date.now()).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

function saveRemote() {
  const p = state.profile;
  return set(ref(db, "users/" + p.phone), { uid: myUid, name: p.name || "", phone: p.phone, birth: p.birth, city: p.city, village: p.village, edu: p.edu, work: p.work, hobby: p.hobby, gender: p.gender, family: p.family, status: p.status, photo: p.photo });
}

function refreshAfterMessage(id) {
  if (currentView === "chatView" && state.activeContact === id) renderMessages();
  if (currentView === "chatsView") renderChats();
}

function listenChat(contact) {
  if (!db || listening[contact.id]) return;
  listening[contact.id] = true;
  onValue(ref(db, "presence/" + contact.id), sn => {
    presence[contact.id] = sn.val();
    if (currentView === "chatView" && state.activeContact === contact.id) updateChatStatus();
  });
  const q = query(ref(db, "chats/" + chatIdWith(contact.id) + "/messages"), limitToLast(200));
  onChildAdded(q, snap => {
    const m = snap.val();
    if (!m || typeof m.text !== "string") return;
    const list = state.messages[contact.id] || (state.messages[contact.id] = []);
    if (list.some(x => x.key === snap.key)) return;
    list.push({ key: snap.key, text: m.text, mine: m.from === myKey(), time: fmtTime(m.ts) });
    refreshAfterMessage(contact.id);
  });
}

function listenInbox() {
  onChildAdded(ref(db, "inbox/" + myKey()), snap => {
    const v = snap.val();
    const id = snap.key;
    if (!v || id === myKey()) return;
    let contact = state.contacts.find(c => c.id === id);
    if (!contact) {
      contact = { id: id, name: showName(v.name, id), photo: "" };
      state.contacts.push(contact);
      saveState();
      renderContacts();
      renderChats();
    }
    listenChat(contact);
  });
}

// ---------- Хранение (локально: профиль и контакты) ----------
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      if (data && typeof data === "object") {
        state.profile = Object.assign(state.profile, data.profile || {});
        state.contacts = Array.isArray(data.contacts) ? data.contacts.filter(c => /^996\d{9}$/.test(c.id)) : [];
      }
    }
  } catch (error) {
    console.log("Не удалось загрузить сохранённые данные.");
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ profile: state.profile, contacts: state.contacts }));
  } catch (error) {
    alert("Не удалось сохранить данные. Возможно, память браузера заполнена.");
  }
}

// ---------- Интерфейс ----------
function makeAvatar(photo, name) {
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  if (photo) {
    const img = document.createElement("img");
    img.src = photo;
    img.alt = "";
    avatar.appendChild(img);
  } else {
    avatar.textContent = name ? name.trim().charAt(0).toUpperCase() : "👤";
  }
  return avatar;
}

function updateHeader() {
  $("headerName").textContent = showName(state.profile.name, state.profile.phone);
  $("headerStatus").textContent = state.profile.phone ? "+" + state.profile.phone : "";
  const avatar = makeAvatar(state.profile.photo, state.profile.name);
  avatar.id = "headerAvatar";
  $("headerAvatar").replaceWith(avatar);

  $("profileName").value = state.profile.name;
  [["pCity","city"],["pVillage","village"],["pEdu","edu"],["pWork","work"],["pHobby","hobby"],["pGender","gender"],["pFamily","family"],["pStatus","status"]].forEach(([i, k]) => { $(i).value = state.profile[k] || ""; });
  const bp = (state.profile.birth || "").split("-");
  $("pBY").value = +bp[0] || "";
  $("pBM").value = +bp[1] || "";
  $("pBD").value = +bp[2] || "";
  $("profilePhone").value = state.profile.phone ? "+" + state.profile.phone : "";
  const profileAvatar = makeAvatar(state.profile.photo, state.profile.name);
  profileAvatar.classList.add("profile-photo");
  profileAvatar.id = "profileAvatar";
  $("profileAvatar").replaceWith(profileAvatar);
}

function showView(viewId) {
  if (viewId === "chatView" && !state.activeContact) viewId = "chatsView";
  currentView = viewId;
  document.querySelector(".app > .header").style.display = (viewId === "cpView" || viewId === "profileView" || viewId === "chatView") ? "none" : "";
  document.querySelector(".bottom-nav").style.display = (viewId === "cpView" || viewId === "chatView") ? "none" : "";

  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === viewId));
  document.querySelectorAll(".nav-button[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === viewId));

  $("headerStatus").textContent = state.profile.phone ? "+" + state.profile.phone : "";

  if (viewId === "chatsView") renderChats();
  if (viewId === "contactsView") renderContacts();
  if (viewId === "profileView") updateHeader();
  if (viewId === "statusView") loadStatuses();

async function addContact() {
  const key = normPhone($("newContactName").value);
  if (!key) { alert("Введи номер: 9 цифр после +996."); return; }
  if (!db) { alert("Firebase не настроен."); return; }

  if (key === myKey()) { alert("Это твой номер."); return; }
  if (state.contacts.some(c => c.id === key)) { alert("Такой контакт уже существует."); return; }

  try {
    const snap = await get(ref(db, "users/" + key));
    if (!snap.exists()) {
      alert("Пользователя с таким номером нет. Пусть он сначала войдёт в чат.");
      return;
    }
    const contact = { id: key, name: showName(snap.val().name, key), photo: "" };
    state.contacts.push(contact);
    saveState();
    listenChat(contact);

    $("newContactName").value = "";
    $("contactModal").classList.remove("show");
    renderChats();
    renderContacts();
    openContact(contact.id);
  } catch (e) {
    console.error(e);
    alert("Не удалось связаться с сервером.");
  }
}

function fmtBirth(b) {
  if (!b) return "";
  const [y, m, d] = b.split("-");
  return [+d || "", MONTHS[+m - 1] || "", +y || ""].filter(Boolean).join(" ");
}

function compress(file, max, cb) {
  const img = new Image();
  img.onload = () => {
    const r = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * r);
    c.height = Math.round(img.height * r);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    cb(c.toDataURL("image/jpeg", 0.7));
  };
  img.onerror = () => alert("Не удалось открыть фото.");
  img.src = URL.createObjectURL(file);
}

      boxes.forEach(x => r.appendChild(x));

// ---------- Звонки (WebRTC, сигналы через Firebase) ----------
let pc = null, localStream = null, callPeer = null, callRole = null, incomingCall = null, callUnsubs = [], pendingIce = [], callTimer = null;
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

function showCall(text, ringing, video) {
  $("callInfo").textContent = text;
  $("callAccept").style.display = ringing ? "inline-block" : "none";
  $("localVideo").style.display = video ? "block" : "none";
  $("callModal").classList.add("show");
}

function addIce(c) {
  if (pc && pc.remoteDescription) pc.addIceCandidate(c).catch(() => {});
  else pendingIce.push(c);
}

function flushIce() {
  pendingIce.forEach(c => pc.addIceCandidate(c).catch(() => {}));
  pendingIce = [];
}

function newPC(calleeId) {
  const c = new RTCPeerConnection(ICE);
  c.onicecandidate = e => {
    if (e.candidate) push(ref(db, "calls/" + calleeId + (callRole === "caller" ? "/icec" : "/icee")), e.candidate.toJSON());
  };
  c.ontrack = e => { $("remoteVideo").srcObject = e.streams[0]; };
  c.onconnectionstatechange = () => {
    if (c.connectionState === "connected") $("callInfo").textContent = "Разговор идёт";
    if (c.connectionState === "failed") { alert("Не удалось соединиться."); endCall(true); }
  };
  return c;
}

function endCall(removeRemote) {
  clearTimeout(callTimer);
  callUnsubs.forEach(f => { try { f(); } catch (e) {} });
  callUnsubs = [];
  if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  $("remoteVideo").srcObject = null;
  $("localVideo").srcObject = null;
  $("callModal").classList.remove("show");
  if (removeRemote && db && callRole) remove(ref(db, "calls/" + (callRole === "caller" ? callPeer : myKey()))).catch(() => {});
  callRole = null; callPeer = null; incomingCall = null; pendingIce = [];
}

async function startCall(video) {
  if (!db) { alert("Нет подключения."); return; }
  const peer = state.activeContact;
  if (!peer || callRole) return;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: !!video });
  } catch (e) {
    alert("Нет доступа к микрофону или камере.");
    return;
  }
  callRole = "caller";
  callPeer = peer;
  const c = state.contacts.find(x => x.id === peer);
  showCall((video ? "Видеозвонок: " : "Звонок: ") + (c ? c.name : "+" + peer), false, video);
  $("localVideo").srcObject = localStream;
  try {
    pc = newPC(peer);
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const cref = ref(db, "calls/" + peer);
    await set(cref, { from: myKey(), name: state.profile.name || "+" + myKey(), video: !!video, offer: { type: offer.type, sdp: offer.sdp }, ts: serverTimestamp() });
    callUnsubs.push(onValue(cref, sn => {
      const v = sn.val();
      if (!v) { endCall(false); return; }
      if (v.answer && pc && !pc.remoteDescription) pc.setRemoteDescription(v.answer).then(flushIce).catch(() => {});
    }));
    callUnsubs.push(onChildAdded(ref(db, "calls/" + peer + "/icee"), sn => addIce(sn.val())));
    callTimer = setTimeout(() => {
      if (pc && pc.connectionState !== "connected") { alert("Не отвечает."); endCall(true); }
    }, 45000);
  } catch (e) {
    alert("Не удалось начать звонок.");
    endCall(true);
  }
}

async function acceptCall() {
  const v = incomingCall;
  if (!v) return;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: !!v.video });
  } catch (e) {
    alert("Нет доступа к микрофону или камере.");
    endCall(true);
    return;
  }
  const me = myKey();
  $("callAccept").style.display = "none";
  $("callInfo").textContent = "Соединение...";
  $("localVideo").style.display = v.video ? "block" : "none";
  $("localVideo").srcObject = localStream;
  try {
    pc = newPC(me);
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    await pc.setRemoteDescription(v.offer);
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await set(ref(db, "calls/" + me + "/answer"), { type: ans.type, sdp: ans.sdp });
    callUnsubs.push(onChildAdded(ref(db, "calls/" + me + "/icec"), sn => addIce(sn.val())));
  } catch (e) {
    alert("Не удалось принять звонок.");
    endCall(true);
  }
}

function listenCalls() {
  onValue(ref(db, "calls/" + myKey()), sn => {
    const v = sn.val();
    if (!v) { if (callRole === "callee") endCall(false); return; }
    if (callRole || !v.offer || v.answer) return;
    if (v.ts && Date.now() - v.ts > 60000) return;
    incomingCall = v;
    callRole = "callee";
    callPeer = v.from;
    showCall((v.name || "+" + v.from) + (v.video ? " — видеозвонок" : " — звонок"), true, false);
  });
}

$("callAudio").addEventListener("click", () => startCall(false));
$("callVideo").addEventListener("click", () => startCall(true));
$("callAccept").addEventListener("click", acceptCall);
$("callEnd").addEventListener("click", () => endCall(true));

// ---------- Запуск ----------
loadState();
updateHeader();
renderChats();
renderContacts();
showView("chatsView");

function startOnline() {
  $("loginModal").classList.remove("show");
  updateHeader();
  if (!db) { alert("Нет подключения к Firebase."); return; }
  get(ref(db, "users/" + state.profile.phone)).then(snap => {
    const v = snap.val();
    if (v) {
      ["name", "birth", "city", "village", "edu", "work", "hobby", "gender", "family", "status", "photo"].forEach(k => { if (!state.profile[k] && v[k]) state.profile[k] = v[k]; });
      saveState();
      updateHeader();
    }
    return saveRemote();
  }).then(() => {
    listenInbox();
    listenCalls();
    state.contacts.forEach(listenChat);
    onValue(ref(db, ".info/connected"), sn => {
      if (sn.val() !== true) return;
      const pr = ref(db, "presence/" + state.profile.phone);
      onDisconnect(pr).set({ on: false, ts: serverTimestamp() }).then(() => set(pr, { on: true, ts: serverTimestamp() }));
    });
  }).catch(() => alert("Нет связи с Firebase. Проверьте правила базы."));
}

$("loginButton").addEventListener("click", function () {
  const phone = normPhone($("loginPhone").value);
  if (!phone) { alert("Введи номер: 9 цифр после +996."); return; }
  state.profile.phone = phone;
  saveState();
  startOnline();
});

if (state.profile.phone) startOnline(); else $("loginModal").classList.add("show");

})();
</script>
